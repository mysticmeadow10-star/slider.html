<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
</head>
<body>

   
    <section>
        <img class="mySlides" src="rocket_sprite-removebg-preview.png" style="height:500px; width:1340px;">
        <img class="mySlides" src="rocket_sprite-removebg-preview.png" style="height:500px; width:1340px;">
        <img class="mySlides" src="rocket_sprite-removebg-preview.png" style="height:500px; width:1340px;">
    </section>

   
    <script>
        let myIndex = 0;
        carousel();

        function carousel() {
            let i;
            let x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            myIndex++;
            if (myIndex > x.length) { myIndex = 1 }
            x[myIndex - 1].style.display = "block";
            setTimeout(carousel, 3000);
        }
    </script>

</body>
</html>
